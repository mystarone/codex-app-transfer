# Codex App Transfer Backend (Tauri Shell Removed)
# 仅保留后端代理功能的版本

[workspace]
resolver = "2"
members = [
    "crates/registry",
    "crates/proxy",
    "crates/adapters",
    "crates/codex_integration",
    "crates/conversation_export",
    "crates/gemini_oauth",
    "crates/usage_tracker",
    "server",  # 新增：后端服务入口
    "xtask",
    # 后续阶段陆续启用:
    # "crates/session_cache",
    # "crates/update",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Codex App Transfer maintainers"]
repository = "https://github.com/Cmochance/codex-app-transfer"
