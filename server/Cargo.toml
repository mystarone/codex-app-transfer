[package]
name = "codex-app-transfer-server"
version = "2.1.15"
description = "Codex App Transfer Backend Server (Tauri Shell Removed)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "codex-app-transfer-server"
path = "src/main.rs"

[dependencies]
codex-app-transfer-registry = { path = "../crates/registry" }
codex-app-transfer-proxy = { path = "../crates/proxy" }
codex-app-transfer-adapters = { path = "../crates/adapters" }
codex-app-transfer-gemini-oauth = { path = "../crates/gemini_oauth" }
axum = { version = "0.8", features = ["http1", "http2", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
